<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176654">
  <meta name="description" content="从治理策略到隐私工程，以可展开的知识地图连接企业数据管理、业务风控与技术项目交付。">
  <title>数据治理知识图谱 · Data Atlas</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <aside class="sidebar" id="sidebar" aria-label="知识导航">
    <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true">⌘</span><span>数据治理知识图谱<small>DATA ATLAS</small></span></a>
    <button class="mobile-close" id="close-menu" aria-label="关闭目录">×</button>
    <nav class="primary-nav" aria-label="视图切换">
      <a href="#overview" data-view="overview"><span aria-hidden="true">◈</span> 体系全景 <span class="nav-key">01</span></a>
      <a href="#comparisons" data-view="comparisons"><span aria-hidden="true">⇄</span> 概念对比 <span class="nav-key">38</span></a>
      <a href="#sources" data-view="sources"><span aria-hidden="true">▤</span> 来源索引 <span class="nav-key">19</span></a>
    </nav>
    <div class="nav-label">知识目录 <span>8 个模块</span></div>
    <nav id="tree" class="tree" aria-label="按模块浏览"></nav>
    <div class="sidebar-foot"><span class="status-dot"></span>企业知识体系 · TPM 应用<br><small>以来源为依据，让知识彼此连接</small></div>
  </aside>
  <button class="scrim" id="scrim" aria-label="关闭目录"></button>
  <div class="workspace">
    <header class="topbar">
      <button class="icon-button mobile-menu" id="open-menu" aria-label="打开目录">☰</button>
      <div id="breadcrumb" class="breadcrumb">知识工作台 <span>/</span> 体系全景</div>
      <button class="search-trigger" id="open-search" aria-label="搜索概念、问题或关键词"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>搜索概念、问题或关键词</span><kbd>⌘ K</kbd></button>
    </header>
    <main id="main" tabindex="-1"><div class="loading" role="status">正在展开知识地图…</div></main>
    <footer class="page-foot"><span>DATA ATLAS / 企业数据治理知识图谱</span><span>学习整理 · 非企业内部架构说明</span></footer>
  </div>
  <dialog id="search-dialog" aria-label="搜索知识图谱">
    <form method="dialog" class="search-head"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="试试：血缘、删除、Shadow、误伤…" aria-label="搜索概念、问题或关键词" autocomplete="off"><button aria-label="关闭搜索">Esc</button></form>
    <div class="search-help">搜索全部 47 个知识点，包含对比、关键理念与来源。</div>
    <div id="search-results" class="search-results" aria-live="polite"></div>
  </dialog>
  <noscript>请启用 JavaScript 以展开知识目录和概念详情。</noscript>
</body>
</html>
