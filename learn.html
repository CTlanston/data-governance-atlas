<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#215f50">
  <title>学习思维导图 · Data Atlas</title>
  <meta name="description" content="从体系、模块进入具体核心概念，以深层问题、易混对比和可放大的系统架构图理解数据治理。">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./learn.css">
  <link rel="stylesheet" href="./memory.css?v=terms-1">
  <link rel="stylesheet" href="./concepts.css?v=concept-2">
  <script src="./terms.js?v=professional-1" defer></script>
  <script src="./memory-core.js?v=terms-1" defer></script>
  <script src="./memory.js?v=terms-1" defer></script>
  <script src="./diagrams.js?v=concept-2" defer></script>
  <script src="./learn.js?v=professional-1" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="identity" href="./learn.html"><img src="./favicon.svg" width="32" height="32" alt=""><span>学习思维导图<small>DATA ATLAS · LEARN</small></span></a>
    <div class="header-note">沿概念深入，把系统关系连起来。</div>
    <nav class="learning-sections" aria-label="学习方式"><button id="map-nav" class="active" aria-current="page">学习导图</button><button id="memory-nav">词汇记忆卡</button></nav>
    <a class="original-link" href="./index.html">速查知识库 ↗</a>
  </header>
  <div class="workspace">
    <aside class="index-panel" id="index-panel" aria-label="知识目录">
      <div class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索概念或问题" aria-label="搜索概念或问题"><button id="clear-search" aria-label="清除搜索" hidden>×</button></div>
      <div class="index-heading"><span id="index-title">8 个模块 · 47 个主题</span><button id="mobile-index-close" aria-label="关闭目录">×</button></div>
      <nav id="index" aria-label="模块与主题"></nav>
      <div class="index-foot"><span class="tiny-dot"></span>核心概念 · 易混对比 · 系统架构<br><small>沿着具体问题，展开机制与例子</small></div>
    </aside>
    <main class="map-panel" aria-label="可展开的六层思维导图">
      <div class="map-toolbar">
        <button class="square mobile-index-open" id="mobile-index-open" aria-label="打开知识目录">☰</button>
        <div class="view-switch" aria-label="导图范围"><button id="show-overview" class="active">全景 · 2 层</button><button id="show-module">主题 · 3 层</button><button id="show-topic">深入 · 4–6 层</button></div>
        <button class="reader-toggle" id="reader-toggle" aria-expanded="true" aria-controls="reader">收起讲解 →</button>
      </div>
      <nav class="map-trail" id="trail" aria-label="当前分支"></nav>
      <div id="viewport" class="viewport" tabindex="0" aria-label="思维导图画布。拖动平移，滚轮缩放。也可使用下方缩放按钮。">
        <div class="map-caption"><span>KNOWLEDGE, UNFOLDED</span><p id="map-caption">先选择一个模块，再沿分支展开。</p></div>
        <div id="world" class="world"><svg id="connections" aria-hidden="true"></svg><div id="nodes"></div></div>
        <div id="loading" class="loading" role="status">正在展开学习导图…</div>
      </div>
      <div class="canvas-footer"><div class="zoom-controls"><button id="zoom-out" aria-label="缩小导图">−</button><output id="zoom-value" aria-label="当前缩放">100%</output><button id="zoom-in" aria-label="放大导图">＋</button><span></span><button id="fit" title="适配当前分支">适配</button><button id="focus-node" title="以可读大小定位当前节点">聚焦</button></div><p>拖动平移 · 滚轮缩放</p></div>
    </main>
    <aside id="reader" class="reader" aria-label="学习讲解"><div class="reader-placeholder">正在准备讲解…</div></aside>
    <section id="memory-section" class="memory-section" aria-label="专业词汇记忆卡"></section>
  </div>
  <button id="drawer-backdrop" class="drawer-backdrop" aria-label="关闭知识目录" hidden></button>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <noscript>请启用 JavaScript 以展开导图和学习内容。</noscript>
</body>
</html>
